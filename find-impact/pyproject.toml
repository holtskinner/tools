[project]
name = "find-impact"
version = "0.1.0"
description = "A Python tool to keep track of external-facing DevRel content and impact across platforms"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Holt Skinner", email = "holtskinner@google.com" }
]
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
]

[project.scripts]
find-impact = "find_impact.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"
